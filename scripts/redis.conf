# Redis 开发环境配置
bind 0.0.0.0
port 6379
timeout 0
keepalive 300

# 数据持久化
save 900 1
save 300 10
save 60 10000

# 日志配置
loglevel notice
logfile ""

# 内存配置
maxmemory 256mb
maxmemory-policy allkeys-lru

# 安全配置
# requirepass your_redis_password

# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# 客户端连接
maxclients 1000